    <h1>烏衣巷</h1>
    <div class="author">唐代・劉禹錫</div>

    <img src="liuyuxi.jpg" alt="唐代詩人劉禹錫畫像" class="poet-img">

    <div class="poem-content">
        朱雀橋邊野草花，烏衣巷口夕陽斜。<br>
        舊時王謝堂前燕，飛入尋常百姓家。
    </div>
